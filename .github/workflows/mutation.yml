name: Mutation Testing

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      mutate:
        description: "Glob (or space-separated globs) of files to mutate"
        required: false
        default: "src/**/*.ts"
      break_threshold:
        description: "Mutation score threshold below which the job fails"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Run Stryker mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation tests
        env:
          STRYKER_BREAK_THRESHOLD: ${{ github.event.inputs.break_threshold || '0' }}
        run: |
          pnpm exec stryker run \
            --mutate "${{ github.event.inputs.mutate || 'src/**/*.ts' }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 30
