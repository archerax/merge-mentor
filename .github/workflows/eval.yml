name: Golden-PR Evaluation Benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "AI Provider for evaluation (mock, copilot-sdk, opencode-sdk)"
        required: true
        default: "mock"
      min_recall:
        description: "Minimum required recall threshold (0.0 - 1.0)"
        required: false
        default: "0.90"
      min_precision:
        description: "Minimum required precision threshold (0.0 - 1.0)"
        required: false
        default: "0.85"

permissions:
  contents: read

jobs:
  eval-benchmark:
    name: Run Golden-PR Corpus Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12

      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Evaluation Harness
        env:
          EVAL_PROVIDER: ${{ github.event.inputs.provider || 'mock' }}
          EVAL_MIN_RECALL: ${{ github.event.inputs.min_recall || '0.90' }}
          EVAL_MIN_PRECISION: ${{ github.event.inputs.min_precision || '0.85' }}
        run: |
          pnpm build
          pnpm eval \
            --provider "$EVAL_PROVIDER" \
            --min-recall "$EVAL_MIN_RECALL" \
            --min-precision "$EVAL_MIN_PRECISION" \
            --output-file "eval-report.json"

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-pr-eval-report
          path: eval-report.json
